services:
  db:
    # Built locally because we need PostGIS *and* pgvector in one image and no
    # published image has both: 01-schema.sql uses PostGIS for the geospatial
    # temple/pandit indexes, migration 12 uses pgvector for AI knowledge
    # retrieval. See docker/postgres/Dockerfile.
    # Rebuild with:  docker compose build db && docker compose up -d db
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: panditconnect-postgres:16-postgis-pgvector
    container_name: panditconnect-db
    restart: unless-stopped
    environment:
      # Bootstrap superuser — owns the schema and runs 01-schema.sql /
      # 02-seed.sql on init. The backend does NOT connect as this role (see
      # `backend` service below); 01-schema.sql creates a separate
      # panditconnect_app role with only the grants it needs, because Row-
      # Level Security policies don't apply to a table's owner.
      POSTGRES_DB: panditconnect
      POSTGRES_USER: panditconnect
      POSTGRES_PASSWORD: panditconnect
    ports:
      - "5433:5432" # host 5433 → avoids clashing with any local Postgres already on 5432
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs once, in filename order, ONLY against an empty data directory.
      #
      # This used to mount the whole of backend/src/db, which worked only while
      # that directory was a flat list of 01..36 migrations. It is now
      # baseline/ + config/ + historical/, and the postgres entrypoint does not
      # recurse — mounting the directory would silently produce an EMPTY
      # database. So the three files are mounted individually, in the same
      # order production applies them:
      #
      #   00  roles, extensions, ownership   (dev twin of tools/00-bootstrap-rds.sql)
      #   01  the production schema baseline — byte-identical to what RDS gets
      #   02  production configuration       — plans, catalogue, tuning
      #   03  marks this database as 'development'
      #
      # Demo/seed data is deliberately NOT loaded: historical/02-seed.sql is
      # fixture content and no longer runs anywhere. A fresh dev stack starts
      # empty, exactly like production, so dev and prod prove the same things.
      - ./backend/src/db/tools/00-bootstrap-dev.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./backend/src/db/baseline/0000-production-baseline.sql:/docker-entrypoint-initdb.d/01-baseline.sql:ro
      - ./backend/src/db/config/0001-production-config.sql:/docker-entrypoint-initdb.d/02-config.sql:ro
      - ./backend/src/db/tools/mark-dev-environment.sql:/docker-entrypoint-initdb.d/03-mark-dev.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U panditconnect -d panditconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: panditconnect-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:8080
      # panditsuggest_app, not the bootstrap superuser and not the owner — the
      # owner is NOLOGIN precisely so nothing can connect as it and bypass RLS
      # (see backend/src/db/tools/hardening.sql H1).
      #
      # Sourced from the environment, NOT hardcoded. In production the value is
      # written into .env at deploy time from AWS Secrets Manager
      # (panditsuggest/rds/app) and points at RDS as panditsuggest_app over
      # TLS with verify-full. Never the RDS master, owner or migrator.
      #
      # The fallback is the local docker database, so `docker compose up` on a
      # laptop still works with no .env entry at all.
      DATABASE_URL: "${DATABASE_URL:-postgresql://panditsuggest_app:dev_app_not_a_secret@db:5432/panditconnect}"
      # Absolute path to the AWS RDS CA bundle inside the container. config/db.js
      # refuses to connect to an RDS host without it rather than falling back to
      # an unverified session — rejectUnauthorized:false is not acceptable here.
      RDS_CA_BUNDLE: /certs/rds-global-bundle.pem
      SESSION_TTL_HOURS: 720
      # Subscription/payment endpoints work end-to-end against Razorpay's
      # test mode once these are set in the root .env — see README "Known
      # placeholders". Empty (the default) leaves /subscribe 501ing.
      RAZORPAY_KEY_ID: "${RAZORPAY_KEY_ID:-}"
      RAZORPAY_KEY_SECRET: "${RAZORPAY_KEY_SECRET:-}"
      # Dev-only key (32 random bytes, hex) for AES-256-GCM encryption of the
      # one field that needs it — an admin's TOTP secret at rest (see
      # backend/src/utils/crypto.js, docs/ADMIN.md). Same posture as
      # POSTGRES_PASSWORD above: a committed placeholder, not a production
      # secret. Changing it invalidates every admin's existing TOTP secret.
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      # Obscurity only, not real access control — see docs/ADMIN.md. Actual
      # admin auth is TOTP + Row-Level Security, same as everywhere else.
      ADMIN_SECRET_PATH: "${ADMIN_SECRET_PATH}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_SECRET_KEY: "${GOOGLE_SECRET_KEY}"
      # AI / RAG — required for embedding queries and generating answers.
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY}"
      # WhatsApp OTP delivery — see backend/.env.example and
      # services/notifications/hyperSender.js. REQUIRED in production: this
      # is the only channel that puts a login OTP in front of a user, so
      # leaving it unset makes phone login impossible. auth.controller.js's
      # requestOtp now returns 503 rather than pretending the code was sent.
      # In development the dev-only console log stands in for it.
      HYPERSENDER_INSTANCE_ID: "${HYPERSENDER_INSTANCE_ID:-}"
      HYPERSENDER_API_KEY: "${HYPERSENDER_API_KEY:-}"
      # S3 + CloudFront media storage — see docs/S3_CLOUDFRONT_MIGRATION.md
      # and backend/.env.example. All optional: unset (the default), media
      # stays on local disk under backend/public/uploads exactly as before
      # this existed. AWS_ACCESS_KEY_ID/SECRET are for local/testing only —
      # prefer an EC2 instance IAM role in real production, which needs
      # neither variable set here at all.
      AWS_REGION: "${AWS_REGION}"
      AWS_S3_MEDIA_BUCKET: "${AWS_S3_MEDIA_BUCKET}"
      MEDIA_CDN_BASE_URL: "${MEDIA_CDN_BASE_URL}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      # Rejects any request not carrying this shared secret as a custom
      # CloudFront origin header — see backend/src/middleware/originVerify.js.
      # Unset = no-op, required for local dev.
      ORIGIN_SHARED_SECRET: "${ORIGIN_SHARED_SECRET}"
    volumes:
      # AWS RDS CA bundle, for verify-full TLS to the production database.
      # Fetched at deploy time (see docs/AWS_RDS_RUNBOOK.md), never vendored.
      - ./certs/rds-global-bundle.pem:/certs/rds-global-bundle.pem:ro
    ports:
      # Loopback only. The distribution/fairness engine trusts a handful of
      # geo headers (cloudfront-viewer-country etc.) as coming from the edge —
      # see services/distribution/market.js's countryFromEdge(). Publishing
      # this on every interface (the old "4000:4000") would let anyone bypass
      # nginx/CloudFront entirely and forge that header straight at the
      # origin, buying themselves the international pandit pool for free.
      # `curl`/Postman access from the production host itself still works via
      # this loopback binding or an SSH tunnel; docker-compose.override.yml
      # re-publishes this on all interfaces for local development, where
      # there is no CDN in front of it to bypass.
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health',{headers:{'x-origin-verify':process.env.ORIGIN_SHARED_SECRET||''}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Google OAuth client ID is a public identifier — safe in the bundle.
        # VITE_ADMIN_SECRET_PATH removed (security fix C3): admin panel is now
        # at /admin-panel; backend secret path resolved at runtime, not build time.
        VITE_GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
        # Browser key for the admin temple location picker. Public by nature —
        # protect it with an HTTP-referrer restriction, not by hiding it.
        VITE_GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
    container_name: panditconnect-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount Let's Encrypt certificates into the container
      - /etc/letsencrypt/live/panditsuggest.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/panditsuggest.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - /etc/letsencrypt/archive/panditsuggest.com:/etc/letsencrypt/archive/panditsuggest.com:ro
      # ACME challenge directory for certificate renewal
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  certbot_webroot:
