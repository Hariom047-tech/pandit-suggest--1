# Explicit allowlist of valid top-level SPA routes NOT already carved out
# into their own `location =`/regex block above (root, /services, /temples,
# /pandits, /ai-recommender, /how-it-works, /online-havan, entity detail pages,
# and the admin
# panel all have their own more-specific location and never reach the
# `location /` catch-all below at all). Used ONLY by that one location, to
# tell a genuinely nonexistent path (soft-404 today — nginx's SPA fallback
# served every unmatched path as 200) from a real route not yet worth its
# own render-injection location. Mirrors App.tsx's <Routes> table by hand —
# a real trade-off (docs/SEO_ARCHITECTURE.md: "would require nginx to know
# the frontend's entire route table, duplicated and kept in sync forever"),
# accepted here because the alternative (every unknown URL silently 200s)
# is worse for a still-small, stable top-level route list.
map $uri $spa_known_route {
    default 0;
    ~^/services/[^/]+/pandits$ 1;
    ~^/(search|temple-map|blog|dashboard|about|contact|login|pandit-login|pandit-forgot-password|privacy|terms)$ 1;
    ~^/pandit(/.*)?$ 1;
}

# HTTP (plain, no redirect) + HTTPS, one block.
#
# panditsuggest.com/www now sit behind a CloudFront distribution, which
# connects to this origin over port 80 only, no TLS. A `return 301
# https://...` here (the old behavior) made CloudFront's own origin fetch
# get redirected right back at itself, forever — ERR_TOO_MANY_REDIRECTS.
# CloudFront's own viewer-protocol policy already forces real visitors onto
# HTTPS at the edge, so nginx doesn't need to redirect anyone itself.
server {
    listen 80;
    listen 443 ssl http2;
    server_name panditsuggest.com www.panditsuggest.com;

    # Apex -> www, preserving the full path and query string (Task: non-www
    # subpath redirect). panditsuggest.com now reaches this same origin via
    # its own CloudFront alternate-domain-name + Route53 ALIAS record (no
    # longer via GoDaddy's path-dropping "Domain Forwarding", which is why
    # this couldn't just be a DNS-level fix). $host-based, not protocol-
    # based — safe alongside the ERR_TOO_MANY_REDIRECTS note above, which was
    # about an http->https redirect colliding with CloudFront's own
    # always-HTTP origin fetch; this only matches the apex hostname
    # specifically, so it can never re-fire on its own redirect target.
    if ($host = panditsuggest.com) {
        return 301 https://www.panditsuggest.com$request_uri;
    }

    # nginx defaults client_max_body_size to 1m, well under the 60MB pandit
    # intro-video cap (middleware/panditMedia.js). Without this, a video
    # upload never reaches the backend at all — nginx itself 413s the
    # request body before proxy_pass, so the multer/S3 size handling in
    # mediaUpload.js never even runs. +5MB over the 60MB app-level cap for
    # multipart overhead (boundaries, other form fields).
    client_max_body_size 65m;

    # Let's Encrypt ACME challenge (needed for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SSL certificates (mounted from host via docker volume)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Modern SSL config (Mozilla recommended)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Text compression was entirely off (stock nginx ships gzip disabled) —
    # every response, including the ~261KB JS entry bundle, was going out
    # over the wire uncompressed. text/html is gzipped by nginx unconditionally
    # and isn't listed below (nginx quirk, not an omission).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Hashed assets (Vite content-hashes the filename, so a given filename's
    # content can never change) get a 1-year cache — everything else must
    # revalidate so a rebuild is picked up without a hard refresh.
    location ~* \.(?:css|js|svg|png|jpe?g|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # /index.html is a real file in the SPA build, so `location /`'s
    # try_files below served it as a plain 200 — a second, crawlable copy of
    # the homepage URL that never passes through the render layer. It had no
    # <title>, no description and no canonical in the HTML (index.html ships
    # none on purpose, see the comment at the top of that file), and React
    # Router has no route for it, so it rendered the NotFound page. Google
    # indexed it from the raw HTML, had no title to use, and invented one
    # from the first alt text on the page — which is how "PanditSuggest Logo"
    # became a search result for this site. Redirected to the real homepage
    # so there is exactly one URL for it.
    #
    # Only external requests reach this: the SPA fallback and the 404 shell
    # get to index.html with `rewrite ... break` / try_files, neither of
    # which re-runs location matching.
    location = /index.html {
        return 301 https://www.panditsuggest.com/;
    }

    # Private routes — the visitor's login, their dashboard, the pandit
    # dashboard and the internal search. These are the SPA shell with no
    # server-side metadata at all, so before JavaScript runs they have no
    # title and no robots tag; the `noindex` their pages set lives in a
    # useEffect and is invisible to anything that does not render.
    #
    # robots.txt used to Disallow them, which made it WORSE, not better:
    # Disallow blocks crawling, not indexing, so Google could still index
    # the URL from a link while being forbidden from ever fetching the page
    # and seeing the noindex. That is the "Indexed, though blocked by
    # robots.txt" state, and a URL in it has no title of its own for Google
    # to use either. The header below is the fix, and those Disallow lines
    # are gone from robots.txt so it can actually be read.
    #
    # `rewrite ... break` rather than try_files, and `always` on the header,
    # for the reason spelled out on the /ambitious-person block below: an
    # internal redirect re-runs location matching and silently drops
    # add_header.
    location ~ ^/(login|search|dashboard|pandit-login|pandit-forgot-password)$|^/pandit(/|$) {
        add_header X-Robots-Tag "noindex, follow" always;
        add_header Cache-Control "no-cache" always;
        rewrite ^ /index.html break;
    }

    # React Router SPA fallback
    location / {
        add_header Cache-Control "no-cache";
        # $uri is checked FIRST, same as before this change — a real static
        # root file (robots.txt, favicon.svg, icons.svg, llms.txt) is served
        # directly and never reaches the allowlist check below. Only a $uri
        # that matches no real file falls through to @spa_or_404.
        try_files $uri @spa_or_404;
    }

    location @spa_or_404 {
        internal;
        add_header Cache-Control "no-cache";
        if ($spa_known_route = 0) {
            return 404;
        }
        rewrite ^ /index.html break;
    }

    # Standard "custom error page with correct status preserved" idiom —
    # reached ONLY via the error_page redirect just below, never by a normal
    # request (no other location points here). A first attempt routed the
    # 404 case back through /index.html directly, which re-entered
    # `location /`'s own try_files, found the real file, and served it as a
    # normal 200 — losing the 404 status. A location with NO try_files
    # fallback of its own doesn't have that problem: error_page's "keep the
    # original status" promise only holds when the target doesn't itself
    # re-resolve through another location's own success path.
    error_page 404 /404-shell.html;
    location = /404-shell.html {
        internal;
        add_header Cache-Control "no-cache";
        # The 404 status is what keeps this out of the index; the header is
        # the belt to that braces, because the shell it serves is titleless
        # and a titleless page is one Google will name from its own content.
        add_header X-Robots-Tag "noindex, follow" always;
        try_files /index.html =404;
    }



    # ── Admin panel hardening ───────────────────────────────────────
    #
    # `noindex` keeps the admin URL out of search results. Appearing in Google
    # is how private surfaces are usually discovered — far more often than by
    # someone guessing paths.
    #
    # THE REAL CONTROL IS THE COMMENTED ALLOW-LIST BELOW. Uncomment it and put
    # your office / home / VPN addresses in, and the admin panel stops being
    # reachable from the internet at all. Everything else here — the secret API
    # path, noindex, the honeypot — only slows down or detects an attacker.
    # An IP allow-list stops one.
    #
    # Path must match ADMIN_BASE in frontend/app/src/admin/lib/adminApi.ts and
    # the <Route> in App.tsx. It is obscurity, not a secret: the value ships
    # inside the JS bundle (see adminApi.ts's note). Deliberately absent from
    # robots.txt — that file is public, so a Disallow line there would announce
    # the path; the noindex header below does the same job privately.
    # /admin-panel, the obvious guess, now returns a plain 404 (it no longer
    # has a location block, so it falls through to the SPA route allowlist).
    location ^~ /ambitious-person {
        # allow 203.0.113.7;      # <- your static IP
        # allow 10.0.0.0/8;       # <- office / VPN range
        # deny  all;

        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store" always;
        # `rewrite ... break`, not `try_files $uri /index.html`: try_files'
        # fallback is an INTERNAL REDIRECT, which re-runs location matching
        # and lands in `location /` — so the response was served by that block
        # and the two add_headers above were silently dropped (verified live:
        # the old /admin-panel block had the same bug, and its noindex header
        # never actually reached the browser). `break` keeps processing in
        # THIS location, so these headers survive. Nothing under this path is
        # ever a real file, so the $uri check try_files did was moot anyway.
        rewrite ^ /index.html break;
    }

    # Source maps publish readable source. They should not exist in a
    # production build (vite.config.ts sets sourcemap:false) — this is the
    # belt to that braces, in case one is ever produced by accident.
    location ~* \.map$ { return 404; }

    # Dotfiles: .env, .git, editor swap files. Never serveable.
    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Uploaded pandit media, served by the backend from backend/public/uploads.
    #
    # `^~` is load-bearing: without it the regex location above
    # (\.(css|js|svg|png|jpe?g|webp|ico)$) wins for an uploaded .jpg — nginx
    # gives regex locations precedence over plain prefix locations — and the
    # file 404s from the SPA root instead of ever reaching the backend.
    location ^~ /uploads/ {
        # Uploaded media should never be indexed — it is user content, and a
        # pandit's photo turning up in image search is not something they agreed to.
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Videos need byte-range requests to be seekable. Buffering the whole
        # response would break scrubbing and delay first frame.
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        # Filenames are random hex and never rewritten, so they can be
        # cached hard.
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Reverse proxy to backend
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dynamic sitemap (backend/src/controllers/sitemap.controller.js) — served
    # at the conventional root path robots.txt's `Sitemap:` line already
    # points at, not under /api. Exact-match `location =` so it wins over the
    # SPA catch-all without needing to be reordered against it.
    location = /sitemap.xml {
        proxy_pass http://backend:4000/api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server-injected SEO metadata (backend/src/controllers/render.controller.js,
    # docs/SEO_ARCHITECTURE.md Phase 7) — a non-JS crawler or link-preview bot
    # hitting the homepage or an entity detail page gets the real title/
    # description/OG/JSON-LD baked into the SPA shell before any JS runs. A
    # real browser gets the identical shell and mounts React exactly as before.
    #
    # `error_page ... = @spa_fallback` is the real safety net: if the backend
    # is unreachable or errors, nginx serves the plain static SPA shell
    # directly instead of showing a visitor a broken page. The backend has
    # its own internal fallback too (serves the unmodified shell on any
    # failure short of "can't reach the frontend at all") — this is the
    # outer layer for that last case.
    location = / {
        proxy_pass http://backend:4000/api/_render/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    # Static pages that used to fall through to the SPA catch-all. Each one was
    # served the identical empty shell, so a crawler's first pass saw no title,
    # no description and no canonical on any of them — Google's Page Indexing
    # report calls that "Duplicate without user-selected canonical". /privacy
    # and /terms matter most here: they render the SAME React component, so
    # without distinct server-side canonicals they are two URLs for one page.
    location = /blog {
        proxy_pass http://backend:4000/api/_render/blog;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /about {
        proxy_pass http://backend:4000/api/_render/about;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /contact {
        proxy_pass http://backend:4000/api/_render/contact;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /temple-map {
        proxy_pass http://backend:4000/api/_render/temple-map;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /privacy {
        proxy_pass http://backend:4000/api/_render/privacy;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /terms {
        proxy_pass http://backend:4000/api/_render/terms;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    # One of these exists per service, and before this they were all the same
    # empty document. `[^/]+` matches the slug only; the entity-detail regex
    # below is anchored with $ and never matched this shape.
    location ~ ^/services/([^/]+)/pandits$ {
        proxy_pass http://backend:4000/api/_render/services/$1/pandits;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location ~ ^/(temples|services|pandits)/[^/]+$ {
        proxy_pass http://backend:4000/api/_render$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    # Same server-injected-metadata treatment, extended to the 5 static
    # directory/utility pages (Phase 7 originally covered only the 4 dynamic
    # entity shapes above — these have no per-request DB lookup, but were
    # previously metadata-less for a non-JS crawler). `=` exact-match always
    # outranks the regex location above regardless of source order, so
    # `/services` (bare) can never be captured by the `/services/:slug`
    # regex — no ordering hazard.
    location = /services {
        proxy_pass http://backend:4000/api/_render/services-list;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /temples {
        proxy_pass http://backend:4000/api/_render/temples-list;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /pandits {
        proxy_pass http://backend:4000/api/_render/pandits-list;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /ai-recommender {
        proxy_pass http://backend:4000/api/_render/ai-recommender;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /online-havan {
        proxy_pass http://backend:4000/api/_render/online-havan;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location = /how-it-works {
        proxy_pass http://backend:4000/api/_render/how-it-works;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa_fallback;
    }

    location @spa_fallback {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Raw SPA shell, fetched by the backend (indexHtmlCache.js) over the
    # internal Docker network to build the responses above. MUST be a
    # separate path from "/" — the backend fetching "/" itself would hit
    # the `location = /` proxy above and bounce back to the backend in an
    # infinite loop. Same content anyone can already get at "/"; the
    # noindex header just keeps it out of search results since nothing
    # links to it.
    location = /__spa-shell__ {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
